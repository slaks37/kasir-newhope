name: Nightly Batch Analytics & Operations Jobs

# Penjadwal resmi adalah Vercel Cron (vercel.json), yang menghormati
# CRON_ENABLED_JOBS. Workflow ini hanya untuk menjalankan ulang secara manual;
# jadwal otomatis di sini dulu membuat job yang sama berjalan dua kali per hari
# dan melewati allowlist job.
on:
  workflow_dispatch:
    inputs:
      job_name:
        description: 'Pilih job untuk dijalankan secara manual'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - insights
          - health
          - billing

jobs:
  run-batch-analytics:
    name: Execute Batch Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Insights Job
        if: ${{ inputs.job_name == 'all' || inputs.job_name == 'insights' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run batch:insights

      - name: Run Merchant Health Job
        if: ${{ inputs.job_name == 'all' || inputs.job_name == 'health' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANALYTICS_DATABASE_URL: ${{ secrets.ANALYTICS_DATABASE_URL || secrets.DATABASE_URL }}
        run: npm run batch:health

      - name: Run Billing Reminders Job
        if: ${{ inputs.job_name == 'all' || inputs.job_name == 'billing' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm run batch:billing
