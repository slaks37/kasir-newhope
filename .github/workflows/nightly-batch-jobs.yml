name: Manual batch diagnostics (dry run)

on:
  # Production scheduling: vercel.json + CRON_ENABLED_JOBS only.
  workflow_dispatch:
    inputs:
      job_name:
        description: 'Diagnosis tanpa menyimpan hasil atau mengirim email'
        required: true
        default: 'insights'
        type: choice
        options:
          - insights
          - health
          - billing

permissions:
  contents: read

jobs:
  run-batch-analytics:
    name: Diagnose Batch Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Insights Job
        if: inputs.job_name == 'insights'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run batch:insights:dry

      - name: Run Merchant Health Job
        if: inputs.job_name == 'health'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANALYTICS_DATABASE_URL: ${{ secrets.ANALYTICS_DATABASE_URL || secrets.DATABASE_URL }}
        run: npm run batch:health:dry

      - name: Run Billing Reminders Job
        if: inputs.job_name == 'billing'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run batch:billing
