name: Subscription QRIS browser regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:qris:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qris-synthetic-browser
          path: |
            build/qris/browser-result.json
            build/qris/browser-*.png
            build/qris/browser-fixture.log
