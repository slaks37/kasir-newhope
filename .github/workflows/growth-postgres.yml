name: Growth durable integration PostgreSQL17
on:
  pull_request:
permissions:
  contents: read
jobs:
  durable-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: newhope_growth_m2_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: growth-synthetic-only
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d newhope_growth_m2_rehearsal"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:growth:integration
        env:
          NEW_HOPE_GROWTH_TEST_CONFIRM: DISPOSABLE_GROWTH_POSTGRES17
          NEW_HOPE_GROWTH_TEST_DATABASE_URL: postgres://postgres:growth-synthetic-only@127.0.0.1:55433/newhope_growth_m2_rehearsal
