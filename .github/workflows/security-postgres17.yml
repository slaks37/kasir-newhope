name: Security PostgreSQL rehearsal
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    name: PostgreSQL${{ matrix.postgres }} migrations, authorization and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: newhope_security_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rehearsal-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newhope_security_rehearsal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEW_HOPE_REHEARSAL_POSTGRES_MAJOR: ${{ matrix.postgres }}
      NEW_HOPE_REHEARSAL_CONFIRM: DISPOSABLE_POSTGRES${{ matrix.postgres }}
      NEW_HOPE_REHEARSAL_DATABASE_URL: postgres://postgres:rehearsal-only@127.0.0.1:55432/newhope_security_rehearsal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse production or populated rehearsal targets
        run: node scripts/dev/test-rehearsal-target.mjs
      - name: Apply reviewed migrations and exercise rollback with synthetic data
        run: node scripts/dev/rehearse-security-postgres17.mjs
      - name: Merchant health uses production schema and serializes concurrent workers
        run: node --import tsx scripts/dev/test-merchant-health.ts --postgres17
      - name: DOKU synthetic concurrency and release gates on PostgreSQL${{ matrix.postgres }}
        run: node --import tsx scripts/dev/rehearse-payments-postgres17.ts
      - name: Save bounded evidence even when a rehearsal fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres${{ matrix.postgres }}-security-evidence
          path: build/security-rehearsal/postgres17.json
          if-no-files-found: warn
          retention-days: 30

  module_rehearsal:
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    name: PostgreSQL${{ matrix.postgres }} module roles, isolation and replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: newhope_security_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rehearsal-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newhope_security_rehearsal"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NEW_HOPE_REHEARSAL_POSTGRES_MAJOR: ${{ matrix.postgres }}
      NEW_HOPE_REHEARSAL_CONFIRM: DISPOSABLE_POSTGRES${{ matrix.postgres }}
      NEW_HOPE_REHEARSAL_DATABASE_URL: postgres://postgres:rehearsal-only@127.0.0.1:55432/newhope_security_rehearsal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/dev/test-rehearsal-target.mjs
      - run: node --import tsx scripts/dev/rehearse-modules-postgres17.ts
      - name: Encrypted synthetic auth backup, restore and identity rollback
        run: node --import tsx scripts/dev/rehearse-auth-backup-postgres17.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres${{ matrix.postgres }}-auth-backup-evidence
          path: build/auth-backup-rehearsal/postgres17.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres${{ matrix.postgres }}-module-evidence
          path: build/module-rehearsal/postgres17.json
          retention-days: 30
