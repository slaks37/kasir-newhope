name: Verifikasi

# KENAPA WORKFLOW INI ADA.
#
# Sebelumnya satu-satunya workflow di repositori ini adalah batch analitik
# malam. Tidak ada yang menjalankan `npm run lint`, `tsc`, atau `npm run smoke`
# pada setiap perubahan — padahal gerbang higiene repo ini bagus dan memeriksa
# hal yang biasanya terlewat (paritas enum TypeScript vs SQL, konsistensi bobot
# model churn di tiga bahasa, byte NUL yang pernah membuat Git menganggap berkas
# analitik 1.866 baris sebagai biner).
#
# Akibatnya terbukti: suite regresi 47 intent AI Copilot rusak dan tidak ada
# yang tahu, karena tidak ada satu pun yang menjalankannya.
#
# Ketiga langkah di bawah berjalan TANPA database dan selesai dalam hitungan
# detik. Migrasi sengaja tidak dijalankan di sini — itu butuh Postgres dan
# kredensial, dan pekerjaan yang lambat cenderung dimatikan orang.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Push beruntun ke branch yang sama tidak perlu diverifikasi semuanya; yang
# penting hanyalah keadaan terakhir.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Higiene, type-check, dan regresi asisten
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Higiene sumber + tsc --noEmit. Dipisah dari langkah berikutnya supaya
      # yang gagal langsung terbaca dari nama langkahnya, bukan dari log.
      - name: Higiene sumber dan type-check
        run: npm run lint

      # Regresi 47 intent. Menjaga rule engine 3.842 baris di
      # src/lib/assistant/intents.ts — bagian yang paling mahal kalau diam-diam
      # berubah, karena jawabannya tetap terlihat masuk akal saat salah.
      - name: Regresi AI Copilot
        run: npm run smoke

      # Peripheral: byte ESC/POS, urutan pulsa laci kasir, dan perilaku antrian
      # cetak saat printer menggantung atau kehabisan kertas. Tidak butuh
      # database maupun perangkat keras.
      - name: Peripheral dan antrian cetak
        run: npx tsx scripts/dev/audit/t-peripheral.ts

      # Antrian sinkronisasi adalah satu-satunya tempat di aplikasi ini yang
      # MENGHAPUS catatan penjualan. Uji ini memastikan ia hanya melakukannya
      # atas pengakuan server yang sungguh-sungguh, bukan atas `ok: true`.
      - name: Antrian sinkronisasi tidak membuang atas jawaban yang bohong
        run: npx tsx scripts/dev/audit/t-jujur.ts

      # Encoder ESC/POS diuji terhadap decoder yang ditulis dari spesifikasi
      # secara TERPISAH, plus printer tiruan lewat HTTP untuk jalur LAN.
      # Tidak butuh database maupun perangkat keras.
      - name: Struk tercetak dan printer tiruan
        run: npx tsx scripts/dev/audit/t-printer.ts

      # Rumus hash PIN klien harus SAMA PERSIS dengan verifikasi server.
      # Kalau meleset, staf terdaftar dengan PIN yang tidak akan pernah cocok.
      - name: PIN staf, klien vs server
        run: npx tsx scripts/dev/audit/t-pin.ts

  postgres:
    name: Probe di PostgreSQL sungguhan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # KENAPA JOB INI ADA.
    #
    # Seluruh probe kesiapan produksi selama ini hanya pernah berjalan di atas
    # PGlite — basis data pengembangan yang repositori ini sendiri sebut "hanya
    # untuk pengembangan" saat menyala. Akibatnya setiap temuannya membawa
    # catatan kaki "angka ini tidak berlaku untuk produksi", tanpa cara apa pun
    # menghilangkannya.
    #
    # Yang ingin dibuktikan justru sebaliknya: jaminan yang sama berlaku di
    # PostgreSQL sungguhan. Menjalankannya di sana juga sudah menemukan hal
    # yang tidak mungkin terlihat di PGlite — galat "portal does not exist"
    # ternyata memang batas PGlite, bukan cacat jalur kode.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AUTH_ALLOW_LOCAL_DEVELOPMENT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Migrasi dari database KOSONG. Ini sendiri sudah pernah menemukan dua
      # cacat: entri duplikat yang membuat migrasi gagal dari nol, dan bawaan
      # kebijakan stok yang tidak berlaku untuk merchant baru.
      - name: Migrasi dari nol
        run: npm run db:migrate

      - name: Isi data contoh
        run: npx tsx scripts/db/seed.ts --force

      - name: Nyalakan pos-service
        run: |
          npx tsx services/pos/index.ts > /tmp/pos.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3101/ready >/dev/null && exit 0
            sleep 1
          done
          echo "pos-service tidak siap:"; cat /tmp/pos.log; exit 1

      - name: Seluruh probe kesiapan produksi
        run: npm run audit:prod

      - name: Log pos-service kalau gagal
        if: failure()
        run: cat /tmp/pos.log || true

  e2e:
    name: E2E jalur kasir
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # KENAPA TERPISAH DARI job verify.
    #
    # Job ini memasang peramban (~150 MB) dan menjalankan build produksi, jadi
    # ia berukuran menit sementara verify berukuran detik. Digabung, seluruh
    # gerbang menjadi selambat bagian yang paling lambat — dan gerbang yang
    # lambat adalah gerbang yang cepat atau lambat dimatikan orang.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pasang Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts memeriksa sendiri apakah Chromium lokal ada; di
      # runner ini tidak ada, jadi ia memakai yang baru dipasang di atas.
      - name: Jalur kasir dari ujung ke ujung
        run: npm run e2e

      - name: Simpan jejak kalau gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
